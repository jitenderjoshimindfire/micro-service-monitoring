version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  service-a:
    build: ./services/service-a
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    ports:
      - "3000:3000"

  service-b:
    build: ./services/service-b
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  service-c:
    build: ./services/service-c
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    ports:
      - "4000:4000"
